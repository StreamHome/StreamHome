name: Player browser regressions

on:
  pull_request:
    paths:
      - "web/**"
      - "server/services/ffmpeg.py"
      - "server/services/media_timing.py"
      - "server/services/media_probe.py"
      - "server/services/playback_prep.py"
      - "server/scratch/test_media_timing.py"
      - ".github/workflows/player-browser.yml"
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=. python scratch/test_media_timing.py
        working-directory: server
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: player-browser-artifacts
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
